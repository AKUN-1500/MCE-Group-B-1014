<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18233a">
<title>Storyworld Nano Trips</title>
<style>
/* 隱藏滾動條但保持滑動功能 */
html, body, #app, * {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar,
#app::-webkit-scrollbar,
*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

:root{--bg:#eef1f5;--card:#fff;--ink:#18233a;--mute:#5d6882;--line:#d5dbe6;--acc:#e8a317;--on-acc:#18233a;--ind:#3a4a7a;--ok:#2e7d5b;--me:#dfe6f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2b;--card:#1b2640;--ink:#eef1f8;--mute:#9aa6c2;--line:#2e3b5c;--acc:#f2b441;--ind:#8fa3df;--ok:#6fd0a3;--me:#2a3a63}}
:root[data-theme="dark"]{--bg:#121a2b;--card:#1b2640;--ink:#eef1f8;--mute:#9aa6c2;--line:#2e3b5c;--acc:#f2b441;--ind:#8fa3df;--ok:#6fd0a3;--me:#2a3a63}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:440px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
header b{font-size:15px;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mute);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
main{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer;text-align:center;width:100%}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
.btn:focus-visible,.lang button:focus-visible,nav button:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 0 4px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:44px}
h1{font-size:24px;margin:6px 0 0;font-weight:600}
.sub{color:var(--mute);font-size:14px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 4px;font:inherit;font-size:14px;cursor:pointer}
.mood.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.mood span{display:block;font-size:22px}
.stops{display:flex;flex-direction:column;gap:0}
.stop{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.stop:not(:last-child)::before{content:"";position:absolute;left:13px;top:36px;bottom:-8px;border-left:2px dashed var(--line)}
.dot{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid var(--line);color:var(--mute);background:var(--card)}
.dot.now{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
.dot.done{border-color:var(--ok);background:var(--ok);color:var(--bg)}
.stop.lock{color:var(--mute)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.msg.me{align-self:flex-end;background:var(--me);border-color:transparent}
.msg small{display:block;color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{text-align:center;padding:16px 8px}
.item .e{font-size:30px}
.item.empty{color:var(--mute);border-style:dashed}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:transparent;color:var(--mute);padding:10px 4px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--ink);font-weight:600}
nav button span{display:block;font-size:20px}
.note{font-size:12px;color:var(--mute);text-align:center}
.recap{border-color:var(--acc);border-width:2px}
</style>
</head>
<body>
<div id="app">
<header><b id="ttl"></b><div class="lang"><button id="l-en">EN</button><button id="l-zh">繁中</button></div></header>
<main id="view"></main>
<nav id="nav"></nav>
</div>
<script>
var UI={
en:{app:"Storyworld Nano Trips",trip:"The Lost Letter",meta:"3 hours | 4 stops | walkable",pick:"Pick your story mood",start:"Start the trip",foot:"Chat with an AI character. No app download needed.",
mood:["Mystery","Romance","Detective"],map:"Map",chat:"Chat",col:"Collection",arrive:"I'm here (simulate GPS)",qr:"Scan QR at venue (simulate)",next:"Next stop",
now:"Current stop",locked:"Locked",done:"Done",noarr:"Reach the stop to start chatting.",pickc:"Choose your move",items:"Keepsakes",recap:"Trip complete",
recapt:"You helped the Guardian Cat find the lost letter.",share:"Copy recap to share",copied:"Recap copied",restart:"Restart trip",cat:"Guardian Cat",ai:"AI character",
proto:"Prototype: GPS and story are simulated.",hint:"Walk to the stop, then tap arrive.",back:"Back to map"},
zh:{app:"故事世界微旅行",trip:"遺失的信",meta:"3 小時｜4 個站點｜可步行",pick:"選擇故事氛圍",start:"開始旅程",foot:"與 AI 角色對話，無需下載 App。",
mood:["懸疑","浪漫","偵探"],map:"地圖",chat:"對話",col:"收藏",arrive:"我到了（模擬 GPS）",qr:"掃描店內 QR（模擬）",next:"下一站",
now:"目前站點",locked:"未解鎖",done:"完成",noarr:"抵達站點後即可開始對話。",pickc:"選擇你的行動",items:"紀念物",recap:"旅程完成",
recapt:"你幫守護貓找回了遺失的信。",share:"複製結語分享",copied:"已複製",restart:"重新開始",cat:"守護貓",ai:"AI 角色",
proto:"原型：GPS 與劇情皆為模擬。",hint:"走到站點後，按「我到了」。",back:"回到地圖"}};
var INTRO={en:["Shh. This neighborhood is whispering.","It feels like a good day to follow a trail together.","Let's look closely. Every detail counts."],
zh:["噓，這個街區正在低語。","今天很適合一起循著線索散步。","仔細看，每個細節都重要。"]};
var STOPS=[
{n:{en:"Tea café",zh:"茶館"},clue:{en:"Meow. The first clue is hiding in this café's menu. Do you see the paw prints?",zh:"喵。第一條線索藏在這家茶館的菜單裡。你看到貓腳印了嗎？"},
 ch:[{t:{en:"Ask the owner",zh:"問老闆"},r:{en:"The owner smiles: a cat left this at dawn. You find a tea-stained note.",zh:"老闆笑著說：清晨有隻貓留下這個。你找到一張沾了茶漬的紙條。"},i:["📝",{en:"Tea-stained note",zh:"茶漬紙條"}]},
     {t:{en:"Follow the paw prints",zh:"跟著腳印走"},r:{en:"The prints stop at a back shelf. Behind a tin you find a small stamp.",zh:"腳印停在後方架子。鐵罐後面有一枚小印章。"},i:["🔖",{en:"Café stamp",zh:"茶館印章"}]}]},
{n:{en:"Bookstore",zh:"書店"},clue:{en:"The note smells of old paper. Which corner kept the letter's secret?",zh:"紙條有舊紙的味道。哪個角落守著信的祕密？"},
 ch:[{t:{en:"Check the poetry shelf",zh:"翻詩集區"},r:{en:"A page is folded at the corner: meet where the lamp stays lit.",zh:"有一頁折了角：到燈一直亮著的地方見面。"},i:["📖",{en:"Folded page",zh:"折角書頁"}]},
     {t:{en:"Ask the clerk",zh:"問店員"},r:{en:"Cats nap by the window at four, she says, handing you a bookmark.",zh:"店員說：貓四點會在窗邊打盹。她遞給你一枚書籤。"},i:["🐾",{en:"Cat bookmark",zh:"貓掌書籤"}]}]},
{n:{en:"Hotel lobby",zh:"飯店大廳"},clue:{en:"The clues point to the lobby, where an old lamp never goes out.",zh:"線索指向大廳，那裡有盞從不熄滅的老燈。"},
 ch:[{t:{en:"Ask the front desk",zh:"問櫃檯"},r:{en:"The concierge brings out a brass key tagged: Room Nine, not a room.",zh:"櫃檯拿出一把黃銅鑰匙，標籤寫著：九號，不是房間。"},i:["🗝️",{en:"Brass key",zh:"黃銅鑰匙"}]},
     {t:{en:"Sit by the lamp",zh:"坐在燈旁"},r:{en:"Under the lamp base, a corner of an envelope sticks out.",zh:"燈座下露出一角信封。"},i:["✉️",{en:"Envelope corner",zh:"信封一角"}]}]},
{n:{en:"Dessert shop",zh:"甜點店"},clue:{en:"Last stop. The letter is close. I can smell something sweet.",zh:"最後一站。信就在附近。我聞到甜甜的味道。"},
 ch:[{t:{en:"Open the recipe drawer",zh:"打開食譜抽屜"},r:{en:"Inside is the letter: an invitation to share a dessert with a stranger today.",zh:"裡面就是那封信：邀請你今天與陌生人分享一份甜點。"},i:["💌",{en:"The lost letter",zh:"遺失的信"}]},
     {t:{en:"Ask the baker",zh:"問烘焙師"},r:{en:"The baker hands over the letter: it was waiting for someone curious.",zh:"烘焙師遞出那封信：它一直在等一個好奇的人。"},i:["💌",{en:"The lost letter",zh:"遺失的信"}]}]}];
var S={lang:"en",mood:0,started:false,tab:"map",s:0,phase:"travel",log:[],items:[]};
try{var sv=localStorage.getItem("snt");if(sv){S=Object.assign(S,JSON.parse(sv))}}catch(e){}
function save(){try{localStorage.setItem("snt",JSON.stringify(S))}catch(e){}}
function u(k){return UI[S.lang][k]}
function tr(o){return o[S.lang]}
function go(tab){S.tab=tab;save();render()}
function setLang(l){S.lang=l;document.documentElement.lang=l==="zh"?"zh-Hant":"en";save();render()}
function arrive(){var st=STOPS[S.s];S.phase="choose";S.log.push({w:"cat",stop:S.s,t:S.s===0?INTRO[S.lang][S.mood]+" "+tr(st.clue):tr(st.clue),k:S.s===0?[INTRO.en[S.mood]+" "+st.clue.en,INTRO.zh[S.mood]+" "+st.clue.zh]:[st.clue.en,st.clue.zh]});S.tab="chat";save();render()}
function pick(i){var st=STOPS[S.s],c=st.ch[i];S.log.push({w:"me",k:[c.t.en,c.t.zh]});S.log.push({w:"cat",k:[c.r.en,c.r.zh]});S.items.push(c.i[0]+"|"+c.i[1].en+"|"+c.i[1].zh);S.phase="done";save();render()}
function nextStop(){S.s++;S.phase="travel";S.tab="map";save();render()}
function restart(){S={lang:S.lang,mood:S.mood,started:false,tab:"map",s:0,phase:"travel",log:[],items:[]};save();render()}
function share(){var txt="Storyworld Nano Trips: "+STOPS.length+" stops, "+S.items.length+" keepsakes. I helped the Guardian Cat find the lost letter.";
try{navigator.clipboard.writeText(txt).then(function(){alert(u("copied"))},function(){alert(txt)})}catch(e){alert(txt)}}
function render(){
 document.getElementById("ttl").textContent=u("app");
 document.getElementById("l-en").className=S.lang==="en"?"on":"";
 document.getElementById("l-zh").className=S.lang==="zh"?"on":"";
 var v=document.getElementById("view"),nav=document.getElementById("nav"),h="";
 if(!S.started){
  nav.style.display="none";
  h+='<div class="hero"><div class="avatar" aria-hidden="true">🐱</div><h1>'+u("trip")+'</h1><div class="sub">'+u("meta")+'</div></div>';
  h+='<div class="card">'+(S.lang==="en"?"Meow! I'm the Guardian Cat. A letter has gone missing in this neighborhood. Will you help me find it?":"喵！我是守護貓。這個街區有一封信不見了，你願意幫我找嗎？")+'</div>';
  h+='<div class="sub">'+u("pick")+'</div><div class="moods">';
  var me=["👻","💗","🔍"];
  for(var i=0;i<3;i++)h+='<button class="mood'+(S.mood===i?" on":"")+'" onclick="S.mood='+i+';save();render()"><span aria-hidden="true">'+me[i]+'</span>'+u("mood")[i]+'</button>';
  h+='</div><button class="btn pri" onclick="S.started=true;S.tab=\'map\';save();render()">'+u("start")+'</button><div class="note">'+u("foot")+'</div>';
 } else {
  nav.style.display="flex";
  var tabs=[["map","🗺️",u("map")],["chat","💬",u("chat")],["col","🎴",u("col")]];
  nav.innerHTML=tabs.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>'}).join("");
  var fin=S.s>=STOPS.length;
  if(S.tab==="map"){
   h+='<div class="card"><b>'+u("trip")+'</b><div class="sub">'+Math.min(S.s,4)+'/4 | '+u("meta")+'</div></div><div class="card stops">';
   STOPS.forEach(function(st,i){var cls=i<S.s?"done":(i===S.s?"now":"lock");
    h+='<div class="stop'+(cls==="lock"?" lock":"")+'"><div class="dot '+cls+'">'+(cls==="done"?"✓":(i+1))+'</div><div><div>'+tr(st.n)+'</div><div class="sub">'+(cls==="done"?u("done"):cls==="now"?u("now"):u("locked"))+'</div></div></div>'});
   h+='</div>';
   if(fin){h+='<div class="card recap"><b>'+u("recap")+'</b><div>'+u("recapt")+'</div></div><button class="btn pri" onclick="go(\'col\')">'+u("col")+'</button>'}
   else if(S.phase==="travel"){h+='<div class="note">'+u("hint")+'</div><button class="btn pri" onclick="arrive()">'+u("arrive")+'</button><button class="btn" onclick="arrive()">'+u("qr")+'</button>'}
   else if(S.phase==="choose"){h+='<button class="btn pri" onclick="go(\'chat\')">'+u("chat")+'</button>'}
   else{h+='<button class="btn pri" onclick="nextStop()">'+u("next")+'</button>'}
   h+='<div class="note">'+u("proto")+'</div>';
  } else if(S.tab==="chat"){
   if(!S.log.length){h+='<div class="card sub">'+u("noarr")+'</div><button class="btn" onclick="go(\'map\')">'+u("back")+'</button>'}
   else{
    h+='<div class="sub">🐱 '+u("cat")+' | '+u("ai")+'</div><div class="msgs">';
    S.log.forEach(function(m){var t=m.k?m.k[S.lang==="zh"?1:0]:m.t;h+='<div class="msg'+(m.w==="me"?" me":"")+'">'+t+'</div>'});
    h+='</div>';
    if(S.phase==="choose"&&!fin){h+='<div class="sub">'+u("pickc")+'</div>';
     STOPS[S.s].ch.forEach(function(c,i){h+='<button class="btn" onclick="pick('+i+')">'+tr(c.t)+'</button>'})}
    else if(S.phase==="done"&&!fin){h+='<button class="btn pri" onclick="nextStop()">'+u("next")+'</button>'}
    else if(fin){h+='<button class="btn pri" onclick="go(\'col\')">'+u("col")+'</button>'}
   }
  } else {
   h+='<div class="sub">'+u("items")+' '+S.items.length+'/4</div><div class="grid">';
   for(var i=0;i<4;i++){var it=S.items[i];
    if(it){var p=it.split("|");h+='<div class="card item"><div class="e">'+p[0]+'</div>'+(S.lang==="zh"?p[2]:p[1])+'</div>'}
    else h+='<div class="card item empty"><div class="e">🔒</div>???</div>'}
   h+='</div>';
   if(fin){h+='<div class="card recap"><b>'+u("recap")+'</b><div>'+u("recapt")+'</div></div><button class="btn pri" onclick="share()">'+u("share")+'</button>'}
   h+='<button class="btn" onclick="restart()">'+u("restart")+'</button>';
  }
 }
 v.innerHTML=h;window.scrollTo(0,0);
}
setLang(S.lang);
</script>
</body>
</html>
